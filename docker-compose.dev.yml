services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: whereissam_backend_dev
    ports:
      - "8000:8000"
    volumes:
      - ./env/whereissam:/app
      - /app/__pycache__
    environment:
      - DEBUG=${DEV_DEBUG:-True}
      - ALLOWED_HOSTS=${DEV_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - CORS_ALLOWED_ORIGINS=${DEV_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - CSRF_TRUSTED_ORIGINS=${DEV_CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${DEV_SECRET_KEY:-django-insecure-dev-key-not-for-production}
      - DATABASE_URL=${DEV_DATABASE_URL:-}
      - SECURE_SSL_REDIRECT=${DEV_SECURE_SSL_REDIRECT:-False}
      - SESSION_COOKIE_SECURE=${DEV_SESSION_COOKIE_SECURE:-False}
      - CSRF_COOKIE_SECURE=${DEV_CSRF_COOKIE_SECURE:-False}
      - SECURE_HSTS_SECONDS=${DEV_SECURE_HSTS_SECONDS:-0}
      - METEOSERVER_API_KEY=${DEV_METEOSERVER_API_KEY:-${METEOSERVER_API_KEY:-}}
      - KNMI_OPEN_DATA_API_KEY=${DEV_KNMI_OPEN_DATA_API_KEY:-${KNMI_OPEN_DATA_API_KEY:-${KNMI_API_KEY:-}}}
    networks:
      - whereissam_network
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: whereissam_frontend_dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=${DEV_REACT_APP_API_URL:-http://127.0.0.1:8000/api/}
      - WDS_SOCKET_HOST=localhost
      - WDS_SOCKET_PORT=3000
    depends_on:
      - backend
    networks:
      - whereissam_network
    command: npm start

networks:
  whereissam_network:
    driver: bridge
