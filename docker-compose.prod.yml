version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: whereissam_db
    environment:
      POSTGRES_DB: ${DB_NAME:-whereissam}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - whereissam_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: whereissam_backend
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-whereissam}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-True}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-True}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-True}
      - SECURE_HSTS_SECONDS=${SECURE_HSTS_SECONDS:-31536000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./env/whereissam/media:/app/media
      - ./env/whereissam/staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    networks:
      - whereissam_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
    container_name: whereissam_frontend
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - whereissam_network
    restart: unless-stopped

  # Optional: Nginx reverse proxy for production (uncomment if not using DigitalOcean Load Balancer)
  # nginx:
  #   image: nginx:alpine
  #   container_name: whereissam_nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #     - ./env/whereissam/staticfiles:/app/staticfiles:ro
  #     - ./env/whereissam/media:/app/media:ro
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - whereissam_network
  #   restart: unless-stopped

networks:
  whereissam_network:
    driver: bridge

volumes:
  postgres_data:
