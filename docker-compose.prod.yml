services:
  db:
    image: postgres:16-alpine
    container_name: whereissam_db
    environment:
      POSTGRES_DB: ${PROD_DB_NAME:-whereissam}
      POSTGRES_USER: ${PROD_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - whereissam_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${PROD_BACKEND_IMAGE}
    pull_policy: always
    container_name: whereissam_backend
    environment:
      - DEBUG=${PROD_DEBUG:-False}
      - SECRET_KEY=${PROD_SECRET_KEY}
      - ALLOWED_HOSTS=${PROD_ALLOWED_HOSTS}
      - DATABASE_URL=postgresql://${PROD_DB_USER:-postgres}:${PROD_DB_PASSWORD:-changeme}@db:5432/${PROD_DB_NAME:-whereissam}
      - CORS_ALLOWED_ORIGINS=${PROD_CORS_ALLOWED_ORIGINS}
      - CSRF_TRUSTED_ORIGINS=${PROD_CSRF_TRUSTED_ORIGINS}
      - SECURE_SSL_REDIRECT=${PROD_SECURE_SSL_REDIRECT:-True}
      - SESSION_COOKIE_SECURE=${PROD_SESSION_COOKIE_SECURE:-True}
      - CSRF_COOKIE_SECURE=${PROD_CSRF_COOKIE_SECURE:-True}
      - SECURE_HSTS_SECONDS=${PROD_SECURE_HSTS_SECONDS:-31536000}
      - GUNICORN_WORKERS=${PROD_GUNICORN_WORKERS:-1}
      - KNMI_OPEN_DATA_API_KEY=${PROD_KNMI_OPEN_DATA_API_KEY:-${KNMI_OPEN_DATA_API_KEY:-${KNMI_API_KEY:-}}}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./env/whereissam/media:/app/media
      - ./env/whereissam/staticfiles:/app/staticfiles
    networks:
      - whereissam_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3

  weather_fetcher:
    image: ${PROD_BACKEND_IMAGE}
    pull_policy: always
    container_name: whereissam_weather_fetcher
    environment:
      - DEBUG=${PROD_DEBUG:-False}
      - SECRET_KEY=${PROD_SECRET_KEY}
      - ALLOWED_HOSTS=${PROD_ALLOWED_HOSTS}
      - DATABASE_URL=postgresql://${PROD_DB_USER:-postgres}:${PROD_DB_PASSWORD:-changeme}@db:5432/${PROD_DB_NAME:-whereissam}
      - CORS_ALLOWED_ORIGINS=${PROD_CORS_ALLOWED_ORIGINS}
      - CSRF_TRUSTED_ORIGINS=${PROD_CSRF_TRUSTED_ORIGINS}
      - SECURE_SSL_REDIRECT=${PROD_SECURE_SSL_REDIRECT:-True}
      - SESSION_COOKIE_SECURE=${PROD_SESSION_COOKIE_SECURE:-True}
      - CSRF_COOKIE_SECURE=${PROD_CSRF_COOKIE_SECURE:-True}
      - SECURE_HSTS_SECONDS=${PROD_SECURE_HSTS_SECONDS:-31536000}
      - KNMI_OPEN_DATA_API_KEY=${PROD_KNMI_OPEN_DATA_API_KEY:-${KNMI_OPEN_DATA_API_KEY:-${KNMI_API_KEY:-}}}
      - WEATHER_FETCH_INTERVAL_SECONDS=${WEATHER_FETCH_INTERVAL_SECONDS:-3600}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - whereissam_network
    restart: unless-stopped
    command:
      - /bin/sh
      - -lc
      - |
        echo "Starting hourly weather fetcher (interval: ${WEATHER_FETCH_INTERVAL_SECONDS}s)"
        while true; do
          date -u +"[%Y-%m-%dT%H:%M:%SZ] Running fetch_weather_vlieland"
          python manage.py fetch_weather_vlieland || true
          sleep "${WEATHER_FETCH_INTERVAL_SECONDS}"
        done

  frontend:
    image: ${PROD_FRONTEND_IMAGE}
    pull_policy: always
    container_name: whereissam_frontend
    depends_on:
      - backend
    expose:
      - "80"
    volumes:
      - ./env/whereissam/staticfiles:/var/www/backend-static:ro
      - ./env/whereissam/media:/var/www/backend-media:ro
    networks:
      - whereissam_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: whereissam_caddy
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - whereissam_network
    restart: unless-stopped

  # Optional: Nginx reverse proxy for production (uncomment if not using DigitalOcean Load Balancer)
  # nginx:
  #   image: nginx:alpine
  #   container_name: whereissam_nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #     - ./env/whereissam/staticfiles:/app/staticfiles:ro
  #     - ./env/whereissam/media:/app/media:ro
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - whereissam_network
  #   restart: unless-stopped

networks:
  whereissam_network:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
