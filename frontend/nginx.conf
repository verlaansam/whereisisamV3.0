server {
  listen 80;
  server_name _;
  client_max_body_size 650M;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
  }

  location /admin/ {
    proxy_pass http://backend:8000/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
  }

  location /ckeditor/ {
    proxy_pass http://backend:8000/ckeditor/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
  }

  location /api-auth/ {
    proxy_pass http://backend:8000/api-auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
  }

  location /static/admin/ {
    alias /var/www/backend-static/admin/;
    expires 1h;
    add_header Cache-Control "public";
  }

  location /static/ckeditor/ {
    alias /var/www/backend-static/ckeditor/;
    expires 1h;
    add_header Cache-Control "public";
  }

  location /static/rest_framework/ {
    alias /var/www/backend-static/rest_framework/;
    expires 1h;
    add_header Cache-Control "public";
  }

  location /static/core/ {
    alias /var/www/backend-static/core/;
    expires 1h;
    add_header Cache-Control "public";
  }

  location /media/ {
    alias /var/www/backend-media/;
    expires 1h;
    add_header Cache-Control "public";
  }

  location / {
    try_files $uri /index.html;
  }

  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  location ~ /\.(?!well-known).* {
    return 404;
  }
}
